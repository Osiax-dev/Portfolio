<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter Tight';
        src: url(../public/fonts/inter-tight-latin.woff2) format('woff2-variations');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        font-family: 'Inter Tight';
        color: #f4f2ee;
        background: radial-gradient(
          ellipse 60% 75% at 50% 40%,
          #66656e 0%,
          #4c4b53 36%,
          #2a2930 76%,
          #1f1e24 100%
        );
      }
      .big {
        position: absolute;
        inset-x: 0;
        left: 0;
        right: 0;
        top: 46px;
        text-align: center;
        font-weight: 800;
        font-size: 230px;
        line-height: 0.8;
        letter-spacing: -0.055em;
      }
      img {
        position: absolute;
        left: 50%;
        transform: translateX(-46%);
        bottom: 0;
        height: 590px;
      }
      .out {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 70px;
        text-align: center;
        font-weight: 800;
        font-size: 112px;
        line-height: 0.8;
        letter-spacing: -0.04em;
        color: transparent;
        -webkit-text-stroke: 2px #f4f2ee;
      }
      .role {
        position: absolute;
        left: 48px;
        bottom: 44px;
        font-size: 22px;
        font-weight: 600;
      }
      .role span {
        display: block;
        color: #d9a57f;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 500;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="big">OSIAX</div>
    <img src="../public/images/osiax-detoure-960.webp" />
    <div class="out">TCHEOUBI</div>
    <p class="role"><span>Parakou, Bénin</span>Développeur web<br />full stack</p>
  </body>
</html>
